<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Roulette</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #f1f1f1;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }
    h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: 0.03em; }
    .player {
      width: 100%;
      max-width: 854px;
      aspect-ratio: 16/9;
    }
    .player iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 6px;
    }
    .title {
      max-width: 854px;
      width: 100%;
      font-size: 0.95rem;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      gap: 12px;
    }
    a.btn {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    a.btn-primary {
      background: #f00;
      color: #fff;
    }
    a.btn-primary:hover { background: #c00; }
    a.btn-secondary {
      background: #272727;
      color: #f1f1f1;
      border: 1px solid #3f3f3f;
    }
    a.btn-secondary:hover { background: #3f3f3f; }
    /* AD SLOT */
    .ad-slot { display: none; }
  </style>
</head>
<body>
  <h1>YouTube Roulette</h1>

  <div class="player">
    <iframe
      src="https://www.youtube.com/embed/{{ video.id }}?autoplay=1"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  {% if video.title %}
  <div class="title">{{ video.title }}</div>
  {% endif %}

  <div class="actions">
    <a class="btn btn-primary" href="/">Next video</a>
    <a class="btn btn-secondary" href="https://www.youtube.com/watch?v={{ video.id }}" target="_blank" rel="noopener">
      Watch on YouTube
    </a>
  </div>

  <!-- AD SLOT -->
  <div class="ad-slot"></div>
</body>
</html>
