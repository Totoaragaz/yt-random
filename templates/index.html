<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ytrandom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #0c0909;
      --surface:      #1a1212;
      --border:       rgba(220, 40, 40, 0.22);
      --accent:       #e03434;
      --accent-hover: #f04444;
      --accent-dim:   rgba(224, 52, 52, 0.12);
      --text:         #f5f0f0;
      --text-muted:   rgba(235, 215, 215, 0.65);
      --text-dim:     rgba(235, 215, 215, 0.38);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', system-ui, 'Noto Sans', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: fixed;
      top: -20vh;
      left: 50%;
      transform: translateX(-50%);
      width: 60vw;
      height: 60vh;
      background: radial-gradient(ellipse, rgba(200, 30, 30, 0.11) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: glowPulse 7s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.7; transform: translateX(-50%) scaleY(1); }
      50%       { opacity: 1;   transform: translateX(-50%) scaleY(1.12); }
    }

    /* Page */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: clamp(700px, 82vw, 1600px);
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: pageEnter 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-top: 16px;
      padding-bottom: 20px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: clamp(2.6rem, 5.5vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.05em;
      color: #fff;
      text-decoration: none;
      line-height: 1;
    }
    .logo .accent { color: var(--accent); }

    .subtitle {
      font-size: clamp(1rem, 1.8vw, 1.35rem);
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.03em;
    }

    .pool-badge {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      background: var(--accent-dim);
      border: 1px solid rgba(220, 40, 40, 0.18);
      padding: 4px 11px;
      border-radius: 999px;
      white-space: nowrap;
      margin-bottom: 4px;
    }

    /* Player */
    .player-shell {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--surface);
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(180, 30, 30, 0.06),
        0 8px 40px rgba(0, 0, 0, 0.5);
      transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: opacity, transform;
    }

    .player-shell.out {
      opacity: 0;
      transform: scale(0.987);
    }

    .player-shell iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Below player */
    .below-player {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .video-info {
      flex: 1;
      min-width: 0;
    }

    .video-title {
      font-size: clamp(0.95rem, 1.5vw, 1.2rem);
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }

    .video-tags {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag {
      font-size: clamp(0.65rem, 1vw, 0.75rem);
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid rgba(220, 40, 40, 0.45);
      background: rgba(220, 40, 40, 0.15);
      color: rgba(255, 160, 160, 0.95);
    }

    .tag.hidden { display: none; }

    /* Buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 7px;
      flex-shrink: 0;
    }

    .btn-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-next {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: clamp(10px, 1.2vw, 14px) clamp(18px, 2vw, 28px);
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: clamp(0.88rem, 1.3vw, 1.05rem);
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: 0 2px 20px rgba(200, 30, 30, 0.4), 0 1px 4px rgba(0,0,0,0.3);
      transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
      user-select: none;
    }

    .btn-next:hover:not(:disabled) {
      background: var(--accent-hover);
      box-shadow: 0 4px 28px rgba(200, 30, 30, 0.55);
      transform: translateY(-1px);
    }

    .btn-next:active:not(:disabled) { transform: translateY(0); }
    .btn-next:disabled { opacity: 0.65; cursor: default; }

    .btn-next .shuffle-icon {
      flex-shrink: 0;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-next:hover:not(:disabled) .shuffle-icon { transform: rotate(180deg); }
    .btn-next.spinning .shuffle-icon {
      animation: spinOnce 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes spinOnce {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .btn-yt {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      text-decoration: none;
      font-size: clamp(0.82rem, 1.2vw, 1rem);
      font-weight: 600;
      padding: clamp(10px, 1.2vw, 14px) clamp(14px, 1.6vw, 22px);
      border-radius: 8px;
      border: 1px solid rgba(235, 215, 215, 0.25);
      background: rgba(255, 255, 255, 0.06);
      transition: color 0.15s, border-color 0.15s, background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn-yt:hover {
      border-color: rgba(235, 215, 215, 0.4);
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .kbd-hint {
      font-size: 0.63rem;
      color: var(--text-dim);
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    kbd {
      font-family: 'Space Grotesk', monospace;
      font-size: 0.6rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      padding: 1px 5px;
      color: var(--text-dim);
    }

    @media (max-width: 600px) {
      body { padding: 16px; }
      .logo { font-size: 3rem; }
      .below-player { flex-direction: column; align-items: flex-start; }
      .video-info { width: 100%; }
      .video-title {
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .btn-group { align-items: flex-start; width: 100%; }
      .btn-row { width: 100%; }
      .btn-next { flex: 1; justify-content: center; }
      .kbd-hint { display: none; }
      .subtitle { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <div class="page">

    <header>
      <div class="brand">
        <a class="logo" href="/">yt<span class="accent">random</span></a>
        <span class="subtitle">Maximized for randomness</span>
      </div>
    </header>

    <div class="player-shell" id="playerShell">
      <iframe
        id="videoFrame"
        src="https://www.youtube.com/embed/{{ video.id }}?autoplay=1"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <div class="below-player">
      <div class="video-info">
        <div class="video-title" id="videoTitle">{{ video.title or '' }}</div>
        <div class="video-tags">
          <span class="tag {% if not video.language %}hidden{% endif %}" id="langTag">
            {% if video.language %}{{ video.language }}{% endif %}
          </span>
          <span class="tag {% if not video.search_date_window %}hidden{% endif %}" id="yearTag">
            {% if video.search_date_window %}{{ video.search_date_window[:4] }}{% endif %}
          </span>
        </div>
      </div>

      <div class="btn-group">
        <div class="btn-row">
          <button class="btn-next" id="btnNext">
            <svg class="shuffle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 3 21 3 21 8"/>
              <polyline points="4 20 9 20 9 15"/>
              <line x1="21" y1="3" x2="14" y2="10"/>
              <line x1="3" y1="21" x2="10" y2="14"/>
            </svg>
            Next video
          </button>
          <a class="btn-yt" id="btnYt"
             href="https://www.youtube.com/watch?v={{ video.id }}"
             target="_blank" rel="noopener noreferrer">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
              <polyline points="15 3 21 3 21 9"/>
              <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
            Watch on YouTube
          </a>
        </div>
        <div class="kbd-hint">press <kbd>Space</kbd> or <kbd>→</kbd> for next</div>
      </div>
    </div>

  </div>

  <script>
    const LANG = {
      en:'English', it:'Italian', es:'Spanish', fr:'French', de:'German',
      ru:'Russian', ro:'Romanian', pt:'Portuguese', tr:'Turkish', nl:'Dutch',
      pl:'Polish', hu:'Hungarian', el:'Greek', lt:'Lithuanian', hr:'Croatian',
      ja:'Japanese', ko:'Korean', zh:'Chinese', ar:'Arabic', hi:'Hindi',
      uk:'Ukrainian', cs:'Czech', sv:'Swedish', no:'Norwegian', da:'Danish',
      fi:'Finnish', sk:'Slovak', bg:'Bulgarian', sr:'Serbian', ca:'Catalan',
    };

    const shell   = document.getElementById('playerShell');
    const frame   = document.getElementById('videoFrame');
    const titleEl = document.getElementById('videoTitle');
    const langTag = document.getElementById('langTag');
    const yearTag = document.getElementById('yearTag');
    const btnNext = document.getElementById('btnNext');
    const btnYt   = document.getElementById('btnYt');

    if (langTag && langTag.textContent.trim()) {
      const code = langTag.textContent.trim();
      langTag.textContent = LANG[code] || code;
    }

    let busy = false;

    async function loadNext() {
      if (busy) return;
      busy = true;
      btnNext.disabled = true;
      btnNext.classList.add('spinning');
      shell.classList.add('out');

      try {
        const res  = await fetch('/api/random');
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        await new Promise(r => setTimeout(r, 300));

        frame.src = `https://www.youtube.com/embed/${data.id}?autoplay=1`;
        titleEl.textContent = data.title || '';
        btnYt.href = `https://www.youtube.com/watch?v=${data.id}`;

        if (data.language) {
          langTag.textContent = LANG[data.language] || data.language;
          langTag.classList.remove('hidden');
        } else {
          langTag.classList.add('hidden');
        }

        if (data.search_date_window) {
          yearTag.textContent = data.search_date_window.slice(0, 4);
          yearTag.classList.remove('hidden');
        } else {
          yearTag.classList.add('hidden');
        }

        shell.classList.remove('out');
      } catch (e) {
        window.location.href = '/';
      } finally {
        busy = false;
        btnNext.disabled = false;
        setTimeout(() => btnNext.classList.remove('spinning'), 500);
      }
    }

    btnNext.addEventListener('click', loadNext);

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === ' ' || e.key === 'ArrowRight') {
        e.preventDefault();
        loadNext();
      }
    });
  </script>
</body>
</html>
