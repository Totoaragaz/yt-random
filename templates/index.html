<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Random</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon.ico" sizes="48x48">
  <link rel="icon" href="/static/favicon-96x96.png" sizes="96x96" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:               #0c0909;
      --surface:          #1a1212;
      --border:           rgba(220, 40, 40, 0.22);
      --accent:           #e03434;
      --accent-hover:     #f04444;
      --accent-dim:       rgba(224, 52, 52, 0.12);
      --text:             #f5f0f0;
      --text-muted:       rgba(235, 215, 215, 0.65);
      --text-dim:         rgba(235, 215, 215, 0.38);
      --logo-color:       #fff;
      --btn-bg:           rgba(255, 255, 255, 0.06);
      --btn-border:       rgba(235, 215, 215, 0.25);
      --btn-hover-bg:     rgba(255, 255, 255, 0.10);
      --btn-hover-border: rgba(235, 215, 215, 0.40);
      --kbd-bg:           rgba(255, 255, 255, 0.05);
      --kbd-border:       rgba(255, 255, 255, 0.10);
      --tag-color:        rgba(255, 160, 160, 0.95);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg:               #faf7f7;
        --surface:          #ede8e8;
        --border:           rgba(180, 30, 30, 0.20);
        --accent:           #c42b2b;
        --accent-hover:     #e03434;
        --accent-dim:       rgba(180, 30, 30, 0.10);
        --text:             #1a1010;
        --text-muted:       rgba(30, 10, 10, 0.60);
        --text-dim:         rgba(30, 10, 10, 0.35);
        --logo-color:       #1a1010;
        --btn-bg:           rgba(0, 0, 0, 0.05);
        --btn-border:       rgba(30, 10, 10, 0.18);
        --btn-hover-bg:     rgba(0, 0, 0, 0.09);
        --btn-hover-border: rgba(30, 10, 10, 0.30);
        --kbd-bg:           rgba(0, 0, 0, 0.06);
        --kbd-border:       rgba(0, 0, 0, 0.12);
        --tag-color:        rgba(140, 0, 0, 0.90);
      }
    }

    [data-theme="dark"] {
      --bg:               #0c0909;
      --surface:          #1a1212;
      --border:           rgba(220, 40, 40, 0.22);
      --accent:           #e03434;
      --accent-hover:     #f04444;
      --accent-dim:       rgba(224, 52, 52, 0.12);
      --text:             #f5f0f0;
      --text-muted:       rgba(235, 215, 215, 0.65);
      --text-dim:         rgba(235, 215, 215, 0.38);
      --logo-color:       #fff;
      --btn-bg:           rgba(255, 255, 255, 0.06);
      --btn-border:       rgba(235, 215, 215, 0.25);
      --btn-hover-bg:     rgba(255, 255, 255, 0.10);
      --btn-hover-border: rgba(235, 215, 215, 0.40);
      --kbd-bg:           rgba(255, 255, 255, 0.05);
      --kbd-border:       rgba(255, 255, 255, 0.10);
      --tag-color:        rgba(255, 160, 160, 0.95);
    }

    [data-theme="light"] {
      --bg:               #faf7f7;
      --surface:          #ede8e8;
      --border:           rgba(180, 30, 30, 0.20);
      --accent:           #c42b2b;
      --accent-hover:     #e03434;
      --accent-dim:       rgba(180, 30, 30, 0.10);
      --text:             #1a1010;
      --text-muted:       rgba(30, 10, 10, 0.60);
      --text-dim:         rgba(30, 10, 10, 0.35);
      --logo-color:       #1a1010;
      --btn-bg:           rgba(0, 0, 0, 0.05);
      --btn-border:       rgba(30, 10, 10, 0.18);
      --btn-hover-bg:     rgba(0, 0, 0, 0.09);
      --btn-hover-border: rgba(30, 10, 10, 0.30);
      --kbd-bg:           rgba(0, 0, 0, 0.06);
      --kbd-border:       rgba(0, 0, 0, 0.12);
      --tag-color:        rgba(140, 0, 0, 0.90);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', system-ui, 'Noto Sans', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: fixed;
      top: -20vh;
      left: 50%;
      transform: translateX(-50%);
      width: 60vw;
      height: 60vh;
      background: radial-gradient(ellipse, rgba(200, 30, 30, 0.11) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: glowPulse 7s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.7; transform: translateX(-50%) scaleY(1); }
      50%       { opacity: 1;   transform: translateX(-50%) scaleY(1.12); }
    }

    /* Theme toggle */
    .btn-theme {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 100;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-theme:hover {
      background: var(--btn-hover-bg);
      border-color: var(--btn-hover-border);
    }

    /* Page */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: clamp(700px, 82vw, 1600px);
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: pageEnter 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-top: 16px;
      padding-bottom: 20px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: clamp(2.6rem, 5.5vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.05em;
      color: var(--logo-color);
      text-decoration: none;
      line-height: 1;
    }
    .logo .accent { color: var(--accent); }

    .subtitle {
      font-size: clamp(1rem, 1.8vw, 1.35rem);
      font-weight: 500;
      color: var(--logo-color);
      letter-spacing: 0.03em;
    }

    /* Player */
    .player-shell {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--surface);
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(180, 30, 30, 0.06),
        0 8px 40px rgba(0, 0, 0, 0.5);
      transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: opacity, transform;
    }

    .player-shell.out {
      opacity: 0;
      transform: scale(0.987);
    }

    .player-shell iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Below player */
    .below-player {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .video-info {
      flex: 1;
      min-width: 0;
    }

    .video-title {
      font-size: clamp(0.95rem, 1.5vw, 1.2rem);
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }

    .video-tags {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag {
      font-size: clamp(0.65rem, 1vw, 0.75rem);
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid rgba(220, 40, 40, 0.45);
      background: rgba(220, 40, 40, 0.15);
      color: var(--tag-color);
    }

    .tag.hidden { display: none; }

    /* Buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 7px;
      flex-shrink: 0;
    }

    .btn-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-next {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: clamp(10px, 1.2vw, 14px) clamp(18px, 2vw, 28px);
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: clamp(0.88rem, 1.3vw, 1.05rem);
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: 0 2px 20px rgba(200, 30, 30, 0.4), 0 1px 4px rgba(0,0,0,0.3);
      transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
      user-select: none;
      white-space: nowrap;
    }

    .btn-next:hover:not(:disabled) {
      background: var(--accent-hover);
      box-shadow: 0 4px 28px rgba(200, 30, 30, 0.55);
      transform: translateY(-1px);
    }

    .btn-next:active:not(:disabled) { transform: translateY(0); }
    .btn-next:disabled { opacity: 0.65; cursor: default; }

    .btn-next .shuffle-icon {
      flex-shrink: 0;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-next:hover:not(:disabled) .shuffle-icon { transform: rotate(180deg); }
    .btn-next.spinning .shuffle-icon {
      animation: spinOnce 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes spinOnce {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .btn-prev {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      padding: clamp(10px, 1.2vw, 14px) clamp(14px, 1.6vw, 22px);
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: clamp(0.82rem, 1.2vw, 1rem);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s, transform 0.1s;
      white-space: nowrap;
      user-select: none;
    }

    .btn-prev:hover:not(:disabled) {
      border-color: var(--btn-hover-border);
      background: var(--btn-hover-bg);
      transform: translateY(-1px);
    }

    .btn-prev:disabled { opacity: 0.3; cursor: default; }

    .btn-yt {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      text-decoration: none;
      font-size: clamp(0.82rem, 1.2vw, 1rem);
      font-weight: 600;
      padding: clamp(10px, 1.2vw, 14px) clamp(14px, 1.6vw, 22px);
      border-radius: 8px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      transition: color 0.15s, border-color 0.15s, background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn-yt:hover {
      border-color: var(--btn-hover-border);
      background: var(--btn-hover-bg);
      transform: translateY(-1px);
    }

    /* Share button — same style as btn-yt but as a <button> */
    .btn-share {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(0.82rem, 1.2vw, 1rem);
      font-weight: 600;
      padding: clamp(10px, 1.2vw, 14px) clamp(14px, 1.6vw, 22px);
      border-radius: 8px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s, transform 0.1s;
      white-space: nowrap;
      user-select: none;
    }

    .btn-share:hover {
      border-color: var(--btn-hover-border);
      background: var(--btn-hover-bg);
      transform: translateY(-1px);
    }

    .kbd-hint {
      font-size: 0.63rem;
      color: var(--text-dim);
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    kbd {
      font-family: 'Space Grotesk', monospace;
      font-size: 0.6rem;
      background: var(--kbd-bg);
      border: 1px solid var(--kbd-border);
      border-radius: 4px;
      padding: 1px 5px;
      color: var(--text-dim);
    }

    @media (min-width: 601px) and (max-width: 900px) {
      body { justify-content: flex-start; padding-top: 48px; }
    }

    @media (max-width: 600px) {
      body { padding: 16px; padding-top: 36px; justify-content: flex-start; }
      .logo { font-size: 3rem; }
      .below-player { flex-direction: column; align-items: flex-start; }
      .video-info { width: 100%; }
      .video-title {
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .btn-group { align-items: flex-start; width: 100%; }
      .btn-row { width: 100%; flex-wrap: wrap; }
      .btn-next { flex: 1; justify-content: center; }
      .btn-break { display: block; flex-basis: 100%; height: 0; }
      .btn-yt, .btn-share { flex: 1; justify-content: center; }
      .kbd-hint { display: none; }
      .subtitle { font-size: 1.15rem; }
      .btn-theme { top: 12px; right: 12px; }
    }
  </style>
</head>
<body>

  <button class="btn-theme" id="themeToggle" aria-label="Toggle theme">
    <!-- Sun icon: shown in dark mode (click to go light) -->
    <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <!-- Moon icon: shown in light mode (click to go dark) -->
    <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
    </svg>
  </button>

  <div class="page">

    <header>
      <div class="brand">
        <a class="logo" href="/">yt<span class="accent">random</span></a>
        <span class="subtitle">Maximized for randomness</span>
      </div>
    </header>

    <div class="player-shell" id="playerShell">
      <iframe
        id="videoFrame"
        src="https://www.youtube.com/embed/{{ video.id }}?autoplay=1&enablejsapi=1"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <div class="below-player">
      <div class="video-info">
        <div class="video-title" id="videoTitle">{{ video.title or '' }}</div>
        <div class="video-tags">
          <span class="tag {% if not video.language %}hidden{% endif %}" id="langTag">
            {% if video.language %}{{ video.language }}{% endif %}
          </span>
          <span class="tag {% if not video.search_date_window %}hidden{% endif %}" id="yearTag">
            {% if video.search_date_window %}{{ video.search_date_window[:4] }}{% endif %}
          </span>
        </div>
      </div>

      <div class="btn-group">
        <div class="btn-row">
          <button class="btn-prev" id="btnPrev" disabled>← <span class="prev-label">Previous</span></button>
          <button class="btn-next" id="btnNext">
            <svg class="shuffle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 3 21 3 21 8"/>
              <polyline points="4 20 9 20 9 15"/>
              <line x1="21" y1="3" x2="14" y2="10"/>
              <line x1="3" y1="21" x2="10" y2="14"/>
            </svg>
            Next video
          </button>
          <div class="btn-break"></div>
          <a class="btn-yt" id="btnYt"
             href="https://www.youtube.com/watch?v={{ video.id }}"
             target="_blank" rel="noopener noreferrer">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
              <polyline points="15 3 21 3 21 9"/>
              <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
            Watch on YouTube
          </a>
          <button class="btn-share" id="btnShare">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
            </svg>
            <span class="share-label">Share</span>
          </button>
        </div>
        <div class="kbd-hint"><kbd>←</kbd> prev &nbsp; <kbd>→</kbd> <kbd>Space</kbd> next</div>
      </div>
    </div>

  </div>

  <script>
    const LANG = {
      en:'English', it:'Italian', es:'Spanish', fr:'French', de:'German',
      ru:'Russian', ro:'Romanian', pt:'Portuguese', tr:'Turkish', nl:'Dutch',
      pl:'Polish', hu:'Hungarian', el:'Greek', lt:'Lithuanian', hr:'Croatian',
      ja:'Japanese', ko:'Korean', zh:'Chinese', ar:'Arabic', hi:'Hindi',
      uk:'Ukrainian', cs:'Czech', sv:'Swedish', no:'Norwegian', da:'Danish',
      fi:'Finnish', sk:'Slovak', bg:'Bulgarian', sr:'Serbian', ca:'Catalan',
    };

    const shell    = document.getElementById('playerShell');
    const frame    = document.getElementById('videoFrame');
    const titleEl  = document.getElementById('videoTitle');
    const langTag  = document.getElementById('langTag');
    const yearTag  = document.getElementById('yearTag');
    const btnNext  = document.getElementById('btnNext');
    const btnPrev  = document.getElementById('btnPrev');
    const btnYt    = document.getElementById('btnYt');
    const btnShare = document.getElementById('btnShare');

    let currentVideo = {
      id: '{{ video.id }}',
      title: {{ video.title | tojson }},
      language: '{{ video.language or "" }}',
      search_date_window: '{{ video.search_date_window or "" }}'
    };
    const videoHistory = [];

    // Sync URL with the current video on page load
    history.replaceState({}, '', '/?v=' + currentVideo.id);

    if (langTag && langTag.textContent.trim()) {
      const code = langTag.textContent.trim();
      langTag.textContent = LANG[code] || code;
    }

    let busy = false;
    let prefetched = null;

    // --- Theme toggle ---

    const themeToggle = document.getElementById('themeToggle');
    const iconSun  = document.getElementById('iconSun');
    const iconMoon = document.getElementById('iconMoon');

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      iconSun.style.display  = theme === 'dark'  ? 'block' : 'none';
      iconMoon.style.display = theme === 'light' ? 'block' : 'none';
    }

    function getSystemTheme() {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    applyTheme(localStorage.getItem('theme') || getSystemTheme());

    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || getSystemTheme();
      const next = current === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    });

    // --- Helpers ---

    function decodeHTML(str) {
      const txt = document.createElement('textarea');
      txt.innerHTML = str;
      return txt.value;
    }

    function getExcludeParam() {
      const ids = videoHistory.map(v => v.id).concat([currentVideo.id]);
      return '?exclude=' + ids.join(',');
    }

    // --- Share ---

    btnShare.addEventListener('click', () => {
      const label = btnShare.querySelector('.share-label');
      navigator.clipboard.writeText(window.location.href).then(() => {
        const orig = label ? label.textContent : '';
        if (label) label.textContent = 'Copied!';
        setTimeout(() => { if (label) label.textContent = orig; }, 2000);
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = window.location.href;
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      });
    });

    // --- YouTube error detection via postMessage ---

    window.addEventListener('message', function(e) {
      if (e.origin !== 'https://www.youtube.com') return;
      try {
        const msg = JSON.parse(e.data);
        if (msg.event === 'infoDelivery' && msg.info && msg.info.error) {
          const code = msg.info.error;
          if ((code === 100 || code === 101 || code === 150) && !busy) {
            setTimeout(loadNext, 1500);
          }
        }
      } catch (_) {}
    });

    // --- Prefetch ---

    async function prefetch() {
      try {
        const res = await fetch('/api/random' + getExcludeParam());
        prefetched = await res.json();
      } catch (e) {
        prefetched = null;
      }
    }

    function updatePrevBtn() {
      btnPrev.disabled = videoHistory.length === 0;
    }

    // --- Apply video to DOM ---

    function applyVideoToDOM(data) {
      frame.contentWindow.location.replace(
        `https://www.youtube.com/embed/${data.id}?autoplay=1&enablejsapi=1`
      );
      titleEl.textContent = decodeHTML(data.title || '');
      btnYt.href = `https://www.youtube.com/watch?v=${data.id}`;
      document.title = decodeHTML(data.title) || 'YouTube Random';
      history.replaceState({}, '', '/?v=' + data.id);

      if (data.language) {
        langTag.textContent = LANG[data.language] || data.language;
        langTag.classList.remove('hidden');
      } else {
        langTag.classList.add('hidden');
      }

      if (data.search_date_window) {
        yearTag.textContent = data.search_date_window.slice(0, 4);
        yearTag.classList.remove('hidden');
      } else {
        yearTag.classList.add('hidden');
      }
    }

    // --- Navigation ---

    async function loadNext() {
      if (busy) return;
      busy = true;
      btnNext.disabled = true;
      btnPrev.disabled = true;
      btnNext.classList.add('spinning');
      shell.classList.add('out');

      try {
        const data = prefetched ?? await fetch('/api/random' + getExcludeParam()).then(r => r.json());
        prefetched = null;
        if (data.error) throw new Error(data.error);

        await new Promise(r => setTimeout(r, 300));

        videoHistory.push(currentVideo);
        if (videoHistory.length > 20) videoHistory.shift();
        currentVideo = data;

        applyVideoToDOM(data);
        shell.classList.remove('out');
        setTimeout(prefetch, 3000);
      } catch (e) {
        window.location.href = '/';
      } finally {
        busy = false;
        btnNext.disabled = false;
        updatePrevBtn();
        setTimeout(() => btnNext.classList.remove('spinning'), 500);
      }
    }

    function loadPrev() {
      if (busy || videoHistory.length === 0) return;
      busy = true;
      btnNext.disabled = true;
      btnPrev.disabled = true;
      shell.classList.add('out');

      setTimeout(() => {
        currentVideo = videoHistory.pop();
        applyVideoToDOM(currentVideo);
        shell.classList.remove('out');
        busy = false;
        btnNext.disabled = false;
        updatePrevBtn();
      }, 300);
    }

    btnNext.addEventListener('click', loadNext);
    btnPrev.addEventListener('click', loadPrev);

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === ' ' || e.key === 'ArrowRight') {
        e.preventDefault();
        loadNext();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        loadPrev();
      }
    });
  </script>
</body>
</html>
