<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ytrandom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #0c0909;
      --surface:      #151010;
      --border:       rgba(220, 40, 40, 0.16);
      --border2:      rgba(220, 40, 40, 0.08);
      --accent:       #e03434;
      --accent-hover: #f04444;
      --accent-muted: rgba(224, 52, 52, 0.6);
      --accent-dim:   rgba(224, 52, 52, 0.1);
      --text:         #f0eaea;
      --text-muted:   rgba(230, 210, 210, 0.5);
      --text-dim:     rgba(230, 210, 210, 0.28);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: fixed;
      top: -25vh;
      left: 50%;
      transform: translateX(-50%);
      width: 65vw;
      height: 65vh;
      background: radial-gradient(ellipse, rgba(200, 30, 30, 0.1) 0%, transparent 68%);
      pointer-events: none;
      z-index: 0;
      animation: glowPulse 7s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.7; transform: translateX(-50%) scaleY(1); }
      50%       { opacity: 1;   transform: translateX(-50%) scaleY(1.1); }
    }

    /* Page wrapper */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 18px 28px 20px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      animation: pageEnter 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .logo {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: #fff;
      text-decoration: none;
      user-select: none;
    }
    .logo .accent { color: var(--accent); }

    .pool-badge {
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      background: var(--accent-dim);
      border: 1px solid var(--border2);
      padding: 3px 10px;
      border-radius: 999px;
    }

    /* Player area — centers a 16:9 box in available space */
    .player-outer {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-shell {
      aspect-ratio: 16 / 9;
      width: 100%;
      max-height: 100%;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(180, 30, 30, 0.06),
        0 4px 6px rgba(0, 0, 0, 0.3),
        0 24px 80px rgba(0, 0, 0, 0.55);
      transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: opacity, transform;
    }

    .player-shell.out {
      opacity: 0;
      transform: scale(0.985);
    }

    .player-shell iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Footer */
    .footer {
      flex-shrink: 0;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .video-info {
      flex: 1;
      min-width: 0;
    }

    .video-title {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 7px;
    }

    .video-tags {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .tag {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--accent-dim);
      color: var(--accent-muted);
    }

    .tag.hidden { display: none; }

    /* Controls */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-next {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 0.87rem;
      letter-spacing: -0.01em;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 2px 16px rgba(200, 30, 30, 0.38), 0 1px 3px rgba(0,0,0,0.25);
      transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
      user-select: none;
    }

    .btn-next:hover:not(:disabled) {
      background: var(--accent-hover);
      box-shadow: 0 4px 24px rgba(200, 30, 30, 0.5);
      transform: translateY(-1px);
    }

    .btn-next:active:not(:disabled) { transform: translateY(0); }
    .btn-next:disabled { opacity: 0.7; cursor: default; }

    .btn-next .shuffle-icon {
      flex-shrink: 0;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-next:hover:not(:disabled) .shuffle-icon { transform: rotate(180deg); }

    .btn-next.spinning .shuffle-icon {
      animation: spinOnce 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes spinOnce {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .btn-yt {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(200, 30, 30, 0.04);
      transition: color 0.15s, border-color 0.15s, background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn-yt:hover {
      color: rgba(230, 210, 210, 0.85);
      border-color: rgba(200, 30, 30, 0.28);
      background: rgba(200, 30, 30, 0.09);
      transform: translateY(-1px);
    }

    .kbd-hint {
      font-size: 0.63rem;
      color: var(--text-dim);
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    kbd {
      font-family: 'Space Grotesk', monospace;
      font-size: 0.6rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 4px;
      padding: 1px 5px;
      color: var(--text-dim);
    }

    @media (max-width: 600px) {
      .page { padding: 14px 16px 16px; }
      .video-title { font-size: 0.88rem; }
      .kbd-hint { display: none; }
      .btn-next { padding: 10px 16px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <header>
      <a class="logo" href="/">yt<span class="accent">random</span></a>
      <span class="pool-badge">{{ video_count }} videos</span>
    </header>

    <div class="player-outer">
      <div class="player-shell" id="playerShell">
        <iframe
          id="videoFrame"
          src="https://www.youtube.com/embed/{{ video.id }}?autoplay=1"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <div class="footer">
      <div class="video-info">
        <div class="video-title" id="videoTitle">{{ video.title or '' }}</div>
        <div class="video-tags">
          <span class="tag {% if not video.language %}hidden{% endif %}" id="langTag">
            {% if video.language %}{{ video.language }}{% endif %}
          </span>
          <span class="tag {% if not video.search_date_window %}hidden{% endif %}" id="yearTag">
            {% if video.search_date_window %}{{ video.search_date_window[:4] }}{% endif %}
          </span>
        </div>
      </div>

      <div class="controls">
        <div class="btn-row">
          <button class="btn-next" id="btnNext">
            <svg class="shuffle-icon" width="13" height="13" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 3 21 3 21 8"/>
              <polyline points="4 20 9 20 9 15"/>
              <line x1="21" y1="3" x2="14" y2="10"/>
              <line x1="3" y1="21" x2="10" y2="14"/>
            </svg>
            Next video
          </button>
          <a class="btn-yt" id="btnYt"
             href="https://www.youtube.com/watch?v={{ video.id }}"
             target="_blank" rel="noopener noreferrer">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
              <polyline points="15 3 21 3 21 9"/>
              <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
            YouTube
          </a>
        </div>
        <div class="kbd-hint">press <kbd>Space</kbd> or <kbd>→</kbd> for next</div>
      </div>
    </div>

  </div>

  <script>
    const LANG = {
      en:'English', it:'Italian', es:'Spanish', fr:'French', de:'German',
      ru:'Russian', ro:'Romanian', pt:'Portuguese', tr:'Turkish', nl:'Dutch',
      pl:'Polish', hu:'Hungarian', el:'Greek', lt:'Lithuanian', hr:'Croatian',
      ja:'Japanese', ko:'Korean', zh:'Chinese', ar:'Arabic', hi:'Hindi',
      uk:'Ukrainian', cs:'Czech', sv:'Swedish', no:'Norwegian', da:'Danish',
      fi:'Finnish', sk:'Slovak', bg:'Bulgarian', sr:'Serbian', ca:'Catalan',
    };

    const shell   = document.getElementById('playerShell');
    const frame   = document.getElementById('videoFrame');
    const titleEl = document.getElementById('videoTitle');
    const langTag = document.getElementById('langTag');
    const yearTag = document.getElementById('yearTag');
    const btnNext = document.getElementById('btnNext');
    const btnYt   = document.getElementById('btnYt');

    // Map raw language codes to full names on initial load
    if (langTag && langTag.textContent.trim()) {
      const code = langTag.textContent.trim();
      langTag.textContent = LANG[code] || code;
    }

    let busy = false;

    async function loadNext() {
      if (busy) return;
      busy = true;
      btnNext.disabled = true;
      btnNext.classList.add('spinning');
      shell.classList.add('out');

      try {
        const res  = await fetch('/api/random');
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        await new Promise(r => setTimeout(r, 300));

        frame.src = `https://www.youtube.com/embed/${data.id}?autoplay=1`;
        titleEl.textContent = data.title || '';
        btnYt.href = `https://www.youtube.com/watch?v=${data.id}`;

        if (data.language) {
          langTag.textContent = LANG[data.language] || data.language;
          langTag.classList.remove('hidden');
        } else {
          langTag.classList.add('hidden');
        }

        if (data.search_date_window) {
          yearTag.textContent = data.search_date_window.slice(0, 4);
          yearTag.classList.remove('hidden');
        } else {
          yearTag.classList.add('hidden');
        }

        shell.classList.remove('out');
      } catch (e) {
        window.location.href = '/';
      } finally {
        busy = false;
        btnNext.disabled = false;
        setTimeout(() => btnNext.classList.remove('spinning'), 500);
      }
    }

    btnNext.addEventListener('click', loadNext);

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === ' ' || e.key === 'ArrowRight') {
        e.preventDefault();
        loadNext();
      }
    });
  </script>
</body>
</html>
